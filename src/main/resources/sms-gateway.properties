# SMS Gateway Configuration for OTP Delivery

# API Endpoints
sms.gateway.api.url.production=https://api.smsgateway.com/api/v1
sms.gateway.api.url.sandbox=https://sandbox.smsgateway.com/api/v1
sms.gateway.api.endpoint.messages=/messages

# Authentication Settings
sms.gateway.auth.type=api_key
sms.gateway.auth.header=Authorization
sms.gateway.auth.prefix=Bearer
sms.gateway.api.key=${SMS_GATEWAY_API_KEY}

# Message Template Configuration
sms.message.template.otp=Your OTP code is {0}. It will expire in {1} minutes. Do not share this code with anyone.
sms.message.sender.id=DEMOAPP

# Delivery Configuration
sms.delivery.retry.count=3
sms.delivery.retry.initial.delay=1000
sms.delivery.retry.multiplier=2
sms.delivery.retry.max.delay=8000
sms.delivery.timeout=5000

# Rate Limiting Parameters
sms.ratelimit.max.requests.per.mobile=5
sms.ratelimit.window.minutes=60
sms.ratelimit.cooldown.minutes=5

# Callback Configuration (Optional)
sms.callback.enabled=false
sms.callback.url=

# Logging Configuration
sms.logging.enabled=true
sms.logging.include.request=true
sms.logging.include.response=true
sms.logging.mask.sensitive.data=true