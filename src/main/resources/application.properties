server.address=localhost
server.port=8080

spring.jackson.serialization.INDENT_OUTPUT=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql = false

# OTP Configuration
otp.expiration.seconds=600
otp.length=6
otp.max-attempts=3
otp.cooling-period.seconds=300

# OTP Rate Limiting
otp.rate-limit.max-requests=5
otp.rate-limit.window-hours=1

# Guava Cache Configuration for OTP Storage
otp.cache.maximum-size=10000
otp.cache.expire-after-write-seconds=600
otp.cache.eviction-policy=LRU

# SMS Gateway Configuration
spring.config.import=optional:sms-gateway.properties